name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: PHP ${{ matrix.php }} / Pest ${{ matrix.pest }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Pest 4
          - php: "8.3"
            pest: "4.*"
            laravel: "12.*"
            testbench: "10.*"
          - php: "8.4"
            pest: "4.*"
            laravel: "12.*"
            testbench: "10.*"
          - php: "8.5"
            pest: "4.*"
            laravel: "12.*"
            testbench: "10.*"
          - php: "8.3"
            pest: "4.*"
            laravel: "13.*"
            testbench: "11.*"
          - php: "8.4"
            pest: "4.*"
            laravel: "13.*"
            testbench: "11.*"
          - php: "8.5"
            pest: "4.*"
            laravel: "13.*"
            testbench: "11.*"
          # Pest 5 requires PHP >= 8.4 and PHPUnit 13, which only Testbench 11 allows.
          - php: "8.4"
            pest: "5.*"
            laravel: "13.*"
            testbench: "11.*"
          - php: "8.5"
            pest: "5.*"
            laravel: "13.*"
            testbench: "11.*"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip
          coverage: none

      - name: Pin Pest, Laravel and Testbench versions
        run: |
          composer require \
            "pestphp/pest:${{ matrix.pest }}" \
            "pestphp/pest-plugin-browser:${{ matrix.pest }}" \
            "illuminate/console:${{ matrix.laravel }}" \
            "illuminate/support:${{ matrix.laravel }}" \
            "orchestra/testbench:${{ matrix.testbench }}" \
            --no-update

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: composer test